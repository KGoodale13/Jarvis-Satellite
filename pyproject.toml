[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-satellite"
version = "0.1.0"
description = "Hardware integration layer for Linux Voice Assistant on Raspberry Pi with DigiAMP+ and ReSpeaker XVF3800"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0"
]

[tool.setuptools]
packages = ["jarvis_satellite"]
