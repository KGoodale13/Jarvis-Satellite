[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-satellite"
version = "0.2.0"
description = "Wake-word Pipecat audio satellite for Raspberry Pi with DigiAMP+ and ReSpeaker XVF3800"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiortc>=1.9,<2",
    "numpy>=1.26,<3",
    "pymicro-wakeword>=2.3,<3",
    "soundcard>=0.4.4,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0"
]

[tool.setuptools]
packages = ["jarvis_satellite"]
